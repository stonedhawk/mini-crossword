<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Mini Crossword</title>
  <!-- Google Fonts: Playfair Display for vintage print serif styling, and Inter for clean sans-serif UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    :root {
      --bg-color: #fafafa;
      --border-color: #000000;
      --cell-size: 56px;
      --black-cell: #121212;
      --accent: #5a67d8;
      --active-word: #e8eaff;
      --text-main: #0f172a;
      --text-muted: #475569;
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }
    
    header {
      background-color: #111827;
      color: #f9fafb;
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px double #000000;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    
    header h1 {
      margin: 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    
    .date {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1rem;
      font-style: italic;
      color: #cbd5e1;
    }
    
    .container {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    
    .congrats {
      background-color: #d1fae5;
      color: #065f46;
      padding: 1.25rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
      border: 2px solid #059669;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    @keyframes slideDown {
      from { transform: translateY(-10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .puzzle-area {
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
      width: 100%;
      margin-top: 0.5rem;
    }
    
    @media (min-width: 768px) {
      .puzzle-area {
        flex-direction: row;
        align-items: flex-start;
      }
    }
    
    .grid-and-controls {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, var(--cell-size));
      grid-template-rows: repeat(5, var(--cell-size));
      gap: 0;
      border: 3px solid var(--border-color);
      background-color: var(--border-color);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      border-radius: 4px;
      overflow: hidden;
      margin: 0 auto;
    }
    
    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      background-color: white;
      border: 1px solid #e2e8f0;
      box-sizing: border-box;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.7rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .cell.black {
      background-color: var(--black-cell);
      border: 1px solid var(--black-cell);
      cursor: default;
    }
    
    .cell-number {
      position: absolute;
      top: 3px;
      left: 4px;
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
      color: var(--text-muted);
      transition: color 0.15s ease;
    }
    
    .cell-value {
      font-family: 'Inter', sans-serif;
      margin-top: 6px;
      transition: color 0.15s ease, transform 0.1s ease;
    }
    
    .cell:not(.black):hover {
      background-color: #f8fafc;
      transform: scale(1.02);
      z-index: 2;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    
    .cell-value.error {
      color: #dc2626 !important;
      font-weight: 800;
      animation: shake 0.2s ease-in-out;
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }
    
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 1.25rem;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.75rem;
    }
    
    .btn-group {
      display: flex;
      gap: 0.5rem;
    }
    
    .btn {
      background-color: #ffffff;
      border: 2px solid var(--border-color);
      border-radius: 4px;
      padding: 0.4rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      color: var(--border-color);
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 0px rgba(0, 0, 0, 1);
      position: relative;
      top: 0;
    }
    
    .btn:hover {
      background-color: #f1f5f9;
      top: -1px;
      box-shadow: 0 3px 0px rgba(0, 0, 0, 1);
    }
    
    .btn:active {
      top: 1px;
      box-shadow: 0 1px 0px rgba(0, 0, 0, 1);
    }
    
    .timer {
      font-weight: 700;
      font-size: 1.15rem;
      font-variant-numeric: tabular-nums;
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      border: 2px solid var(--border-color);
      padding: 0.35rem 0.75rem;
      border-radius: 4px;
      box-shadow: 0 2px 0px rgba(0, 0, 0, 1);
    }
    
    .clues-container {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      flex: 1;
      width: 100%;
      background: #ffffff;
      border: 2px solid var(--border-color);
      border-radius: 6px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      max-height: 440px;
      overflow-y: auto;
      box-sizing: border-box;
    }
    
    .clues-container::-webkit-scrollbar {
      width: 6px;
    }
    .clues-container::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 3px;
    }
    .clues-container::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    .clues-container::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    
    .clues-column h3 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.4rem;
      font-weight: 800;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .clues-column ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    
    .clues-column li {
      padding: 0.6rem 0.8rem;
      cursor: pointer;
      border-radius: 4px;
      line-height: 1.4;
      font-size: 0.95rem;
      margin-bottom: 0.35rem;
      transition: all 0.15s ease;
      display: flex;
      gap: 0.5rem;
      border: 1px solid transparent;
    }
    
    .clues-column li:hover {
      background-color: #f1f5f9;
      border-color: #e2e8f0;
    }
    
    .clues-column li.active-clue {
      background-color: var(--active-word);
      border-color: #cbd5e1;
      font-weight: 600;
    }
    
    .clues-column strong {
      color: var(--accent);
      min-width: 1.5rem;
      display: inline-block;
    }
    
    .keyboard-hints {
      margin-top: 1.5rem;
      padding: 0.8rem 1.2rem;
      border: 2px dashed #cbd5e1;
      border-radius: 6px;
      text-align: center;
      background: #ffffff;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      width: 100%;
      box-sizing: border-box;
    }
    
    .keyboard-hints strong {
      color: var(--text-main);
    }
    
    footer {
      padding: 1.5rem;
      text-align: right;
      border-top: 1px solid #e2e8f0;
      margin-top: auto;
    }
    
    .signature {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    /* Active Clue Banner */
    .active-clue-banner {
      width: 100%;
      background: #f8fafc;
      border: 2px solid var(--border-color);
      border-radius: 4px;
      padding: 0.8rem 1rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 2px 0px rgba(0, 0, 0, 1);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-sizing: border-box;
      animation: fadeIn 0.2s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .active-clue-label {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 800;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      white-space: nowrap;
    }
    
    .active-clue-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-main);
      flex: 1;
    }
    
    /* Validation Badges */
    .validation-badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      white-space: nowrap;
      border: 1.5px solid currentColor;
    }
    
    .validation-badge.valid {
      background-color: #d1fae5;
      color: #065f46;
    }
    
    .validation-badge.invalid {
      background-color: #fef3c7;
      color: #b45309;
    }
    
    .validation-badge.typo {
      background-color: #fee2e2;
      color: #b91c1c;
      animation: pulse-glow 1.5s infinite;
    }
    
    @keyframes pulse-glow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
    }
    
    /* Lexical Assistant */
    .lexical-assistant {
      background: #ffffff;
      border: 2px solid var(--border-color);
      border-radius: 6px;
      padding: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-sizing: border-box;
      width: 100%;
    }
    
    @keyframes slideUp {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .lexical-assistant h3 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.2rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.4rem;
    }
    
    .assistant-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0;
      margin-bottom: 1rem;
    }
    
    .dict-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .dict-link:hover {
      text-decoration: underline;
    }
    
    .pattern-display {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 1rem;
      background: #f1f5f9;
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      display: inline-block;
    }
    
    .pattern-display code {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--accent);
      font-size: 1rem;
    }
    
    .suggestions-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }
    
    .suggestions-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    
    .suggestion-btn {
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: 4px;
      padding: 0.35rem 0.7rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 1.5px 0px rgba(0, 0, 0, 1);
      position: relative;
      top: 0;
    }
    
    .suggestion-btn:hover {
      background: var(--active-word);
      border-color: var(--accent);
      color: var(--accent);
      top: -1px;
      box-shadow: 0 2.5px 0px rgba(0, 0, 0, 1);
    }
    
    .suggestion-btn:active {
      top: 1px;
      box-shadow: 0 0.5px 0px rgba(0, 0, 0, 1);
    }
    
    .no-suggestions {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="dictionary-data.js"></script>
  <script src="trie-engine.js"></script>
  <script src="puzzles.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    const App = () => {
      const dayOfYear = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
      const [puzzleIndex, setPuzzleIndex] = useState(dayOfYear % puzzles.length);
      const currentPuzzle = puzzles[puzzleIndex];
      const initialLayout = currentPuzzle.layout;

      const [gridState, setGridState] = useState(
        Array(5).fill().map(() => Array(5).fill(''))
      );
      const [activeCell, setActiveCell] = useState(null); // [r, c]
      const [direction, setDirection] = useState('across'); // 'across' or 'down'
      
      const [checkedCells, setCheckedCells] = useState(new Set());
      const [gameWon, setGameWon] = useState(false);
      const [timerState, setTimerState] = useState({ started: false, seconds: 0 });

      const dateStr = new Date().toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });

      // Timer effect
      useEffect(() => {
        let interval;
        if (timerState.started && !gameWon) {
          interval = setInterval(() => {
            setTimerState(prev => ({ ...prev, seconds: prev.seconds + 1 }));
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [timerState.started, gameWon]);

      // Scroll active clue into view
      useEffect(() => {
        const activeClue = document.querySelector('.active-clue');
        if (activeClue) {
          activeClue.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }, [activeCell, direction]);

      const formatTime = (totalSeconds) => {
        const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
        const s = (totalSeconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      // Check Win Condition
      useEffect(() => {
        let isFull = true;
        let isCorrect = true;
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 5; c++) {
            if (initialLayout[r][c] === 0) {
              if (gridState[r][c] === '') {
                isFull = false;
              } else if (gridState[r][c] !== currentPuzzle.answers[r][c]) {
                isCorrect = false;
              }
            }
          }
        }
        if (isFull && isCorrect && !gameWon) {
          setGameWon(true);
          setTimerState(prev => ({ ...prev, started: false }));
        }
      }, [gridState, initialLayout, currentPuzzle, gameWon]);

      // Compute puzzle cell numbers and word start coordinates
      const puzzleSpecs = useMemo(() => {
        const numbers = {};
        const wordStarts = { across: {}, down: {} };
        const cellToWordMap = {}; 
        let currentNum = 1;

        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 5; c++) {
            if (initialLayout[r][c] === 1) continue;
            let needsNumber = false;
            let isAcrossStart = false;
            let isDownStart = false;

            // Across start?
            if (c === 0 || initialLayout[r][c - 1] === 1) {
              if (c < 4 && initialLayout[r][c + 1] === 0) {
                isAcrossStart = true;
                needsNumber = true;
              }
            }
            // Down start?
            if (r === 0 || initialLayout[r - 1][c] === 1) {
              if (r < 4 && initialLayout[r + 1][c] === 0) {
                isDownStart = true;
                needsNumber = true;
              }
            }

            if (needsNumber) {
              numbers[`${r}-${c}`] = currentNum;
              if (isAcrossStart) wordStarts.across[currentNum] = [r, c];
              if (isDownStart) wordStarts.down[currentNum] = [r, c];
              currentNum++;
            }
          }
        }
        
        // Map individual cells to their across/down word numbers
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 5; c++) {
            if (initialLayout[r][c] === 1) continue;
            cellToWordMap[`${r}-${c}`] = { across: null, down: null };
            
            // Find across word number
            let ac = c;
            while (ac >= 0 && initialLayout[r][ac] === 0) {
              const num = numbers[`${r}-${ac}`];
              if (num && wordStarts.across[num]) {
                cellToWordMap[`${r}-${c}`].across = num;
                break;
              }
              ac--;
            }
            
            // Find down word number
            let ar = r;
            while (ar >= 0 && initialLayout[ar][c] === 0) {
              const num = numbers[`${ar}-${c}`];
              if (num && wordStarts.down[num]) {
                cellToWordMap[`${r}-${c}`].down = num;
                break;
              }
              ar--;
            }
          }
        }
        
        return { numbers, wordStarts, cellToWordMap };
      }, [initialLayout]);

      const trie = useMemo(() => new TrieEngine(window.DICTIONARY_WORDS || []), []);

      const getActiveWordInfo = useCallback(() => {
        if (!activeCell) return null;
        const [r, c] = activeCell;
        const wordNum = puzzleSpecs.cellToWordMap[`${r}-${c}`][direction];
        if (!wordNum) return null;

        // Find all cell coordinates for this word
        const cells = [];
        for (let row = 0; row < 5; row++) {
          for (let col = 0; col < 5; col++) {
            if (initialLayout[row][col] === 1) continue;
            const thisWordNum = puzzleSpecs.cellToWordMap[`${row}-${col}`][direction];
            if (thisWordNum === wordNum) {
              cells.push({ r: row, c: col });
            }
          }
        }

        // Sort cells based on direction (across sorts by col, down sorts by row)
        cells.sort((a, b) => direction === 'across' ? a.c - b.c : a.r - b.r);

        const wordString = cells.map(cell => gridState[cell.r][cell.c]).join('');
        const patternString = cells.map(cell => gridState[cell.r][cell.c] === '' ? '.' : gridState[cell.r][cell.c]).join('');
        
        return {
          num: wordNum,
          cells,
          wordString,
          patternString
        };
      }, [activeCell, direction, gridState, puzzleSpecs, initialLayout]);

      const activeWordInfo = useMemo(() => getActiveWordInfo(), [getActiveWordInfo]);

      const activeWordValidation = useMemo(() => {
        if (!activeWordInfo) return null;
        const { wordString } = activeWordInfo;
        if (wordString.length === 5) {
          const isValid = trie.validate(wordString);
          return { status: isValid ? 'valid' : 'invalid', text: isValid ? 'Valid Word' : 'Not in Dict' };
        } else if (wordString.length > 0) {
          const isValidPrefix = trie.isPrefix(wordString);
          return { status: isValidPrefix ? 'prefix' : 'typo', text: isValidPrefix ? '' : 'Typo?' };
        }
        return null;
      }, [activeWordInfo, trie]);

      const patternSuggestions = useMemo(() => {
        if (!activeWordInfo) return [];
        const { patternString } = activeWordInfo;
        if (patternString === '.....') return [];
        return trie.findPatternMatches(patternString, 8);
      }, [activeWordInfo, trie]);

      const handleApplySuggestion = (suggestion) => {
        if (!activeWordInfo) return;
        const newGrid = [...gridState.map(row => [...row])];
        activeWordInfo.cells.forEach((cell, idx) => {
          newGrid[cell.r][cell.c] = suggestion[idx].toUpperCase();
        });
        setGridState(newGrid);
        
        const newChecked = new Set(checkedCells);
        activeWordInfo.cells.forEach(cell => {
          newChecked.delete(`${cell.r}-${cell.c}`);
        });
        setCheckedCells(newChecked);
        
        // Start timer if not started
        if (!timerState.started) {
          setTimerState(prev => ({ ...prev, started: true }));
        }
      };

      const handleCellClick = (r, c) => {
        if (initialLayout[r][c] === 1 || gameWon) return;
        
        if (activeCell && activeCell[0] === r && activeCell[1] === c) {
          setDirection(prev => prev === 'across' ? 'down' : 'across');
        } else {
          setActiveCell([r, c]);
        }
      };

      const getNextCell = (r, c, dir, advance = 1) => {
        let nr = r;
        let nc = c;
        if (dir === 'across') {
          nc += advance;
        } else {
          nr += advance;
        }
        
        if (nr >= 0 && nr < 5 && nc >= 0 && nc < 5 && initialLayout[nr][nc] === 0) {
          return [nr, nc];
        }
        return [r, c];
      };

      const handleKeyDown = useCallback((e) => {
        if (!activeCell || gameWon) return;
        
        // Start timer on first input
        if (!timerState.started && e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {
          setTimerState(prev => ({ ...prev, started: true }));
        }

        const [r, c] = activeCell;
        
        if (e.key === 'Tab') {
           e.preventDefault();
           setDirection(prev => prev === 'across' ? 'down' : 'across');
           return;
        }

        if (/^[a-zA-Z]$/.test(e.key)) {
          const newGrid = [...gridState.map(row => [...row])];
          newGrid[r][c] = e.key.toUpperCase();
          setGridState(newGrid);
          
          if (checkedCells.has(`${r}-${c}`)) {
            const newChecked = new Set(checkedCells);
            newChecked.delete(`${r}-${c}`);
            setCheckedCells(newChecked);
          }
          
          setActiveCell(getNextCell(r, c, direction, 1));
          return;
        }
        
        if (e.key === 'Backspace') {
           const newGrid = [...gridState.map(row => [...row])];
           if (newGrid[r][c] !== '') {
             newGrid[r][c] = '';
             setGridState(newGrid);
             if (checkedCells.has(`${r}-${c}`)) {
               const newChecked = new Set(checkedCells);
               newChecked.delete(`${r}-${c}`);
               setCheckedCells(newChecked);
             }
           } else {
             const prevCell = getNextCell(r, c, direction, -1);
             setActiveCell(prevCell);
             const clearGrid = [...gridState.map(row => [...row])];
             clearGrid[prevCell[0]][prevCell[1]] = '';
             setGridState(clearGrid);
             if (checkedCells.has(`${prevCell[0]}-${prevCell[1]}`)) {
               const newChecked = new Set(checkedCells);
               newChecked.delete(`${prevCell[0]}-${prevCell[1]}`);
               setCheckedCells(newChecked);
             }
           }
           return;
        }
        
        if (e.key === ' ') {
          e.preventDefault();
          setDirection(prev => prev === 'across' ? 'down' : 'across');
          return;
        }
        
        if (e.key === 'ArrowRight') {
          if (c < 4 && initialLayout[r][c+1] === 0) setActiveCell([r, c+1]);
        } else if (e.key === 'ArrowLeft') {
          if (c > 0 && initialLayout[r][c-1] === 0) setActiveCell([r, c-1]);
        } else if (e.key === 'ArrowDown') {
          if (r < 4 && initialLayout[r+1][c] === 0) setActiveCell([r+1, c]);
        } else if (e.key === 'ArrowUp') {
          if (r > 0 && initialLayout[r-1][c] === 0) setActiveCell([r-1, c]);
        }

      }, [activeCell, direction, gridState, initialLayout]);

      useEffect(() => {
        document.addEventListener('keydown', handleKeyDown);
        return () => document.removeEventListener('keydown', handleKeyDown);
      }, [handleKeyDown]);

      const isActive = (r, c) => activeCell && activeCell[0] === r && activeCell[1] === c;
      
      const isInActiveWord = (r, c) => {
        if (!activeCell) return false;
        if (isActive(r, c)) return false;
        
        const activeWordNum = puzzleSpecs.cellToWordMap[`${activeCell[0]}-${activeCell[1]}`][direction];
        const thisWordNum = puzzleSpecs.cellToWordMap[`${r}-${c}`][direction];
        
        return activeWordNum && thisWordNum && activeWordNum === thisWordNum;
      };

      const getActiveWordNumber = () => {
        if (!activeCell) return null;
        return puzzleSpecs.cellToWordMap[`${activeCell[0]}-${activeCell[1]}`][direction];
      };

      const handleClueClick = (dir, num) => {
        if (gameWon) return;
        const startCoord = puzzleSpecs.wordStarts[dir][num];
        if (startCoord) {
          setActiveCell(startCoord);
          setDirection(dir);
        }
      };

      const handleCheck = (e) => {
        if(e) e.currentTarget.blur();
        const newChecked = new Set();
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 5; c++) {
            if (initialLayout[r][c] === 0 && gridState[r][c] !== '' && gridState[r][c] !== currentPuzzle.answers[r][c]) {
              newChecked.add(`${r}-${c}`);
            }
          }
        }
        setCheckedCells(newChecked);
      };

      const handleReveal = (e) => {
        if(e) e.currentTarget.blur();
        const newGrid = [...gridState.map(row => [...row])];
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 5; c++) {
            if (initialLayout[r][c] === 0) {
              newGrid[r][c] = currentPuzzle.answers[r][c];
            }
          }
        }
        setGridState(newGrid);
        setCheckedCells(new Set());
        if (!timerState.started) setTimerState(prev => ({ ...prev, started: true }));
      };

      const handleClear = (e) => {
        if(e) e.currentTarget.blur();
        if (confirm("Clear the entire puzzle?")) {
           setGridState(Array(5).fill().map(() => Array(5).fill('')));
           setCheckedCells(new Set());
           setTimerState({ started: false, seconds: 0 });
           setGameWon(false);
           setActiveCell(null);
        }
      };

      const handlePlayNext = (e) => {
        if(e) e.currentTarget.blur();
        setPuzzleIndex((prev) => (prev + 1) % puzzles.length);
        setGridState(Array(5).fill().map(() => Array(5).fill('')));
        setCheckedCells(new Set());
        setTimerState({ started: false, seconds: 0 });
        setGameWon(false);
        setActiveCell(null);
      };

      return (
        <React.Fragment>
          <header>
            <h1>Mini Crossword</h1>
            <div className="date">{dateStr}</div>
          </header>
          
          <main className="container">
            {gameWon && (
              <div className="congrats">
                🎉 Congratulations! You solved the puzzle in {formatTime(timerState.seconds)}.
              </div>
            )}
            <div className="puzzle-area">
              <div className="grid-and-controls">
                {activeWordInfo && (
                  <div className="active-clue-banner">
                    <span className="active-clue-label">
                      {direction.toUpperCase()} {activeWordInfo.num}:
                    </span>
                    <span className="active-clue-text">
                      {currentPuzzle.clues[direction][activeWordInfo.num]}
                    </span>
                    {activeWordValidation && activeWordValidation.text && (
                      <span className={`validation-badge ${activeWordValidation.status}`}>
                        {activeWordValidation.status === 'valid' && '✓ '}
                        {activeWordValidation.status === 'invalid' && '✗ '}
                        {activeWordValidation.status === 'typo' && '⚠️ '}
                        {activeWordValidation.text}
                      </span>
                    )}
                  </div>
                )}

                <div className="toolbar">
                  <div className="btn-group">
                    <button className="btn" onClick={handleCheck}>Check</button>
                    <button className="btn" onClick={handleReveal}>Reveal</button>
                    <button className="btn" onClick={handleClear}>Clear</button>
                    <button className="btn" onClick={handlePlayNext}>Next ➔</button>
                  </div>
                  <div className="timer">{formatTime(timerState.seconds)}</div>
                </div>
                <div className="grid-container">
                  {initialLayout.map((row, rIndex) => (
                    row.map((cellType, cIndex) => {
                      const isBlack = cellType === 1;
                      const cellKey = `${rIndex}-${cIndex}`;
                      const num = puzzleSpecs.numbers[cellKey];
                      const isError = checkedCells.has(cellKey);
                      
                      let cellClass = 'cell';
                      if (isBlack) cellClass += ' black';
                      else if (isActive(rIndex, cIndex)) cellClass += ' active';
                      else if (isInActiveWord(rIndex, cIndex)) cellClass += ' highlight';
                      
                      return (
                        <div 
                           key={cellKey} 
                           className={cellClass}
                           onClick={() => handleCellClick(rIndex, cIndex)}
                           style={{
                             backgroundColor: isBlack ? 'var(--black-cell)' : 
                                              isActive(rIndex, cIndex) ? 'var(--accent)' :
                                              isInActiveWord(rIndex, cIndex) ? 'var(--active-word)' : 'white',
                             color: isActive(rIndex, cIndex) ? 'white' : 'black'
                           }}
                        >
                          {!isBlack && num && (
                            <span 
                              className="cell-number" 
                              style={{ color: isActive(rIndex, cIndex) ? 'rgba(255,255,255,0.8)' : 'var(--text-muted)' }}
                            >
                              {num}
                            </span>
                          )}
                          {!isBlack && (
                             <span className={`cell-value ${isError ? 'error' : ''}`}>{gridState[rIndex][cIndex]}</span>
                          )}
                        </div>
                      );
                    })
                  ))}
                </div>
                
                <div className="keyboard-hints">
                  <small><strong>Shortcuts:</strong> Space/Click toggles direction • Arrows move • Tab shifts axis</small>
                </div>
              </div>
              
              <div className="sidebar-right" style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: '1.5rem', width: '100%', boxSizing: 'border-box' }}>
                <div className="clues-container" style={{ maxHeight: '290px' }}>
                  <div className="clues-column">
                    <h3>Across</h3>
                    <ul>
                      {Object.entries(currentPuzzle.clues.across).map(([num, text]) => (
                        <li 
                          key={`across-${num}`}
                          className={direction === 'across' && getActiveWordNumber() === Number(num) ? 'active-clue' : ''}
                          onClick={() => handleClueClick('across', num)}
                        >
                          <strong>{num}</strong> {text}
                        </li>
                      ))}
                    </ul>
                  </div>
                  <div className="clues-column">
                    <h3>Down</h3>
                    <ul>
                      {Object.entries(currentPuzzle.clues.down).map(([num, text]) => (
                        <li 
                          key={`down-${num}`}
                          className={direction === 'down' && getActiveWordNumber() === Number(num) ? 'active-clue' : ''}
                          onClick={() => handleClueClick('down', num)}
                        >
                          <strong>{num}</strong> {text}
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>

                {activeWordInfo && (
                  <div className="lexical-assistant">
                    <h3>
                      <span className="icon">💡</span> Lexical Assistant
                    </h3>
                    <p className="assistant-desc">
                      Powered by <a href="https://github.com/stonedhawk/game-ready-dictionary" target="_blank" className="dict-link">game-ready-dictionary</a>.
                    </p>
                    
                    <div className="pattern-display">
                      Pattern: <code>{activeWordInfo.patternString}</code>
                    </div>
                    
                    {patternSuggestions.length > 0 ? (
                      <div className="suggestions-section">
                        <div className="suggestions-label">Suggestions (Click to autofill):</div>
                        <div className="suggestions-list">
                          {patternSuggestions.map(word => (
                            <button 
                              key={word} 
                              className="suggestion-btn"
                              onClick={() => handleApplySuggestion(word)}
                              title="Click to autofill this word into the grid"
                            >
                              {word}
                            </button>
                          ))}
                        </div>
                      </div>
                    ) : (
                      <div className="no-suggestions">
                        {activeWordInfo.patternString === '.....' 
                          ? 'Start typing to see matching dictionary words!' 
                          : 'No matching words found in the dictionary.'}
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          </main>
          
          <footer>
            <div className="signature">Created by Stonedhawk (Rahul)</div>
          </footer>
        </React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
